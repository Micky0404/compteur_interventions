<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historique des interventions</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<!-- 🔥 HEADER PRIVÉ -->
<header class="neo-header">
  <div class="header-left">
    <h1 class="app-title">Historique</h1>
  </div>

  <div class="header-right">
    <button class="header-btn" onclick="window.location.href='./compteur.html'">Compteur</button>

    <!-- Bouton admin affiché dynamiquement -->
    <button class="header-btn" id="admin-btn" style="display:none;" onclick="window.location.href='./admin.html'">
      Admin
    </button>

    <button class="header-btn logout-btn">Déconnexion</button>
  </div>
</header>

<!-- 🔥 CONTENU -->
<div class="container">

  <h2 style="text-align:center;">Historique des interventions</h2>

  <!-- GRAPHIQUE -->
  <div class="chart-container">
    <canvas id="chart"></canvas>
  </div>

</div>

<!-- TABLEAU -->
<table class="history-table">
  <thead>
    <tr>
      <th>Date</th>
      <th>Heure</th>
      <th>Véhicule</th>
    </tr>
  </thead>

  <!-- 🔥 ID UNIQUE ET CORRECT -->
  <tbody id="history-table-body"></tbody>
</table>

<!-- 🔥 LIBRAIRIES CHART.JS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>

<!-- 🔥 SCRIPT HISTORIQUE -->
<script type="module" src="./js/historique.js"></script>

</body>
</html>
