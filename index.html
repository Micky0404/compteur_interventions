<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Accueil</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: radial-gradient(circle at top, #330000, #000000);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Segoe UI", Arial, sans-serif;
      color: white;
      overflow: hidden;
    }

    .glow {
      position: absolute;
      width: 450px;
      height: 450px;
      background: rgba(255, 0, 0, 0.25);
      filter: blur(140px);
      animation: float 6s infinite alternate ease-in-out;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
    }

    @keyframes float {
      from { transform: translate(-50%, -40px); }
      to { transform: translate(-50%, 40px); }
    }

    .card {
      position: relative;
      padding: 60px 50px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(14px);
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.45);
      text-align: center;
      z-index: 2;
      width: 380px;
      animation: fadeIn 1.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .logo {
      width: 150px;
      margin-bottom: 25px;
      filter: drop-shadow(0 0 12px #ff1a1a);
      animation: pulse 2.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { transform: scale(1); filter: drop-shadow(0 0 10px #ff1a1a); }
      50% { transform: scale(1.05); filter: drop-shadow(0 0 18px #ff3333); }
      100% { transform: scale(1); filter: drop-shadow(0 0 10px #ff1a1a); }
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 40px;
      color: #ff1a1a;
      text-shadow: 0 0 20px #ff1a1a;
      font-weight: 700;
    }

    .btn {
      display: block;
      margin: 15px auto;
      padding: 18px;
      width: 85%;
      background: linear-gradient(90deg, #ff1a1a, #b30000);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 1.3rem;
      cursor: pointer;
      text-decoration: none;
      transition: 0.3s;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
      font-weight: 600;
    }

    .btn:hover {
      transform: scale(1.07);
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.7);
    }
  </style>
</head>

<body>

  <div class="glow"></div>

  <div class="card">

    <!-- LOGO AU CENTRE -->
    <img src="./monimage.png" alt="Logo" class="logo">

    <h1>Bienvenue</h1>

    <a href="./login.html" class="btn">Connexion</a>
    <a href="./register.html" class="btn">Créer un compte</a>
  </div>

</body>
</html>
