<!-- 🔥 MODALE AJOUT VEHICULE -->
<div class="modal" id="addModal">
  <div class="modal-content">

    <h2>Ajouter un véhicule</h2>

    <input type="text" id="vehicleName" placeholder="Nom du véhicule">

    <br><br>

    <!-- Photo via caméra -->
    <button id="takePhotoBtn">Prendre une photo</button>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
    <img id="photoPreview" style="max-width:200px; margin-top:10px; display:none;">

    <br><br>

    <!-- Upload classique -->
    <input type="file" id="uploadImage" accept="image/*">

    <br><br>

    <button id="confirmAddVehicle" class="primary-btn">
      Enregistrer
    </button>

  </div>
</div>
