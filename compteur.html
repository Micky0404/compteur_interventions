<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compteur véhicules</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<!-- 🔥 HEADER PRIVÉ -->
<header class="neo-header">
  <div class="header-right">

    <!-- Bouton Historique -->
    <button class="header-btn" onclick="window.location.href='./historique.html'">
      Historique
    </button>

    <!-- Bouton admin (affiché par JS si admin) -->
    <button class="header-btn" id="admin-btn" style="display:none;"
            onclick="window.location.href='./admin.html'">
      Admin
    </button>

    <!-- Déconnexion -->
    <button class="header-btn logout-btn">Déconnexion</button>

  </div>
</header>


<!-- 🔥 CONTENU PRINCIPAL -->
<div class="container">

  <h1>Véhicules de <span id="pseudo"></span></h1>

  <!-- Bouton ajout véhicule -->
  <button id="addVehicleBtn" class="primary-btn">
    Ajouter un véhicule
  </button>

  <!-- Liste des véhicules -->
  <div id="vehicleList" class="vehicle-list"></div>

</div>


<!-- 🔥 MODALE AJOUT VEHICULE -->
<div class="modal" id="addModal">
  <div class="modal-content">

    <h2>Ajouter un véhicule</h2>

    <input type="text" id="vehicleName" placeholder="Nom du véhicule">

    <br><br>

    <!-- Photo via caméra -->
    <button id="takePhotoBtn">Prendre une photo</button>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">

    <!-- Preview -->
    <img id="photoPreview" style="max-width:200px; margin-top:10px; display:none;">

    <br><br>

    <!-- Upload classique -->
    <input type="file" id="uploadImage" accept="image/*">

    <br><br>

    <button id="confirmAddVehicle" class="primary-btn">
      Enregistrer
    </button>

  </div>
</div>


<!-- 🔥 MODALE MODIFICATION VEHICULE -->
<div class="modal" id="editModal">
  <div class="modal-content">

    <h2>Modifier le véhicule</h2>

    <input type="text" id="editVehicleName" placeholder="Nouveau nom">

    <br><br>

    <!-- Photo via caméra -->
    <button id="editTakePhotoBtn">Prendre une photo</button>
    <input type="file" id="editCameraInput" accept="image/*" capture="environment" style="display:none;">

    <!-- Preview -->
    <img id="editPhotoPreview" style="max-width:200px; margin-top:10px; display:none;">

    <br><br>

    <!-- Upload classique -->
    <input type="file" id="editUploadImage" accept="image/*">

    <br><br>

    <button id="saveEditBtn" class="primary-btn">
      Enregistrer
    </button>

  </div>
</div>


<!-- 🔥 SCRIPT -->
<script type="module" src="./js/compteur.js"></script>

</body>
</html>
