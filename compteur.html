<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compteur véhicules</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<!-- 🔥 HEADER ULTRA STYLÉ (version privée) -->
<header class="neo-header">
  <div class="header-left">
    <h1 class="app-title">Compteur d’interventions</h1>
  </div>

  <div class="header-right">
    <!-- Bouton admin affiché dynamiquement par JS -->
    <button class="header-btn" id="admin-btn" style="display:none;" onclick="window.location.href='./admin.html'">Admin</button>

    <button class="header-btn logout-btn" onclick="window.location.href='./login.html'">Déconnexion</button>
  </div>
</header>

<!-- 🔥 CONTENU PRINCIPAL -->
<div class="container">

  <h1>Véhicules de <span id="pseudo"></span></h1>

  <!-- Bouton ajout véhicule -->
  <button id="addVehicleBtn" class="primary-btn">
    Ajouter un véhicule
  </button>

  <!-- Liste des véhicules -->
  <div id="vehicleList" class="vehicle-list"></div>

</div>

<!-- 🔥 MODALE AJOUT VEHICULE -->
<div class="modal" id="vehicleModal">
  <div class="modal-content">
    <h2>Ajouter un véhicule</h2>

    <input type="text" id="vehicleName" placeholder="Nom du véhicule">

    <br><br>

    <button id="takePhotoBtn">Prendre une photo</button>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
    <img id="photoPreview" style="max-width:200px; margin-top:10px; display:none;">

    <br><br>

    <input type="file" id="uploadImage" accept="image/*">

    <br><br>

    <button id="saveVehicleBtn" class="primary-btn">
      Enregistrer
    </button>
  </div>
</div>

<script type="module" src="./js/compteur.js"></script>

</body>
</html>
