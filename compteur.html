<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compteur d'interventions</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <!-- 🔥 HEADER -->
    <header class="main-header">
        <h1 id="user-title">Mes véhicules</h1>

        <nav class="header-nav">
            <button id="admin-btn" class="btn-admin" style="display:none;">Admin</button>
            <button id="addVehicleBtn" class="btn-primary">Ajouter un véhicule</button>
            <button id="logoutBtn" class="btn-danger">Déconnexion</button>
        </nav>
    </header>

    <!-- 🔥 LISTE DES VÉHICULES -->
    <section class="vehicle-section">
        <div id="vehicleList" class="vehicle-list"></div>
    </section>

    <!-- 🔥 MODAL AJOUT -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <h2>Ajouter un véhicule</h2>

            <label>Nom du véhicule :</label>
            <input type="text" id="vehicleName" placeholder="Ex : Kangoo, Clio...">

            <label>Importer une image :</label>
            <input type="file" id="imageFile" accept="image/*">

            <button id="openCameraBtn" class="btn-secondary">Prendre une photo</button>
            <video id="cameraPreview" autoplay style="display:none;"></video>

            <div class="modal-actions">
                <button id="saveVehicleBtn" class="btn-primary">Enregistrer</button>
                <button id="closeAddModal" class="btn-danger">Annuler</button>
            </div>
        </div>
    </div>

    <!-- 🔥 MODAL ÉDITION -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h2>Modifier le véhicule</h2>

            <label>Nouveau nom :</label>
            <input type="text" id="editName">

            <label>Nouvelle image (optionnel) :</label>
            <input type="file" id="editImageFile" accept="image/*">

            <div class="modal-actions">
                <button id="saveEditBtn" class="btn-primary">Enregistrer</button>
                <button id="closeEditModal" class="btn-danger">Annuler</button>
            </div>
        </div>
    </div>

    <script type="module" src="./js/compteur.js"></script>
</body>
</html>
