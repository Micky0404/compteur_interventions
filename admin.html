<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<!-- 🔥 HEADER ADMIN -->
<header class="neo-header">
  <div class="header-left">
    <h1 class="app-title">Compteur d’interventions</h1>
  </div>

  <div class="header-right">
    <button class="header-btn" onclick="window.location.href='./compteur.html'">Compteur</button>
    <button class="header-btn logout-btn">Déconnexion</button>
  </div>
</header>

<!-- 🔥 CONTENU ADMIN -->
<div class="container">

  <h2>Dashboard Administrateur</h2>
  <p>Gestion complète des utilisateurs et validation des accès</p>

  <h3>Liste des utilisateurs</h3>

  <!-- Liste générée par admin.js -->
  <div id="userList" class="admin-list"></div>

</div>

<!-- 🔥 STATISTIQUES ADMIN -->
<div id="stats-container">

  <div class="stat-card">
    <h3>Total utilisateurs</h3>
    <p id="totalUsers">0</p>
  </div>

  <div class="stat-card">
    <h3>Utilisateurs validés</h3>
    <p id="validatedUsers">0</p>
  </div>

  <div class="stat-card">
    <h3>Total véhicules</h3>
    <p id="totalVehicles">0</p>
  </div>

  <div class="stat-card">
    <h3>Total sorties</h3>
    <p id="totalSorties">0</p>
  </div>

</div>

<!-- 🔥 GRAPHIQUE TOP VÉHICULES -->
<canvas id="topVehiclesChart"></canvas>

<!-- 🔥 SCRIPTS -->
<script type="module" src="./js/admin.js?v=1"></script>
<script type="module" src="./admin-stats.js"></script>

</body>
</html>
